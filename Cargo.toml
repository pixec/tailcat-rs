[package]
name = "tailcat-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "The Rust implementation of Tailcat's server component, enabling Tailcat clients to securely access local services over WireGuard and DERP"
repository = "https://github.com/pixec/tailcat-rs"
readme = "README.md"

[features]
default = ["std"]
std = [
    "dep:boringtun",
    "dep:nix",
    "dep:rand",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "tracing/std",
]
exec = ["std"]
ssh = ["std", "dep:russh", "nix/ioctl", "nix/process", "nix/signal", "nix/term", "nix/user"]
sftp = ["ssh", "dep:russh-sftp", "dep:cap-std", "dep:cap-fs-ext"]
perf = ["std"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ciborium = { version = "0.2", default-features = false }
crc32fast = { version = "1", default-features = false }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "async"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

boringtun = { version = "0.7", default-features = false, optional = true }
cap-fs-ext = { version = "4", optional = true }
cap-std = { version = "4", optional = true }
nix = { version = "0.31", features = ["net", "socket"], optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"], optional = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "serve"
required-features = ["std"]

[[test]]
name = "interop"
required-features = ["std"]

[[test]]
name = "interop_services"
required-features = ["exec", "ssh", "sftp", "perf"]
